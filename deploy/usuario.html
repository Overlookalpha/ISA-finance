
<!DOCTYPE html>
<html lang="pt-BR">
 
<head>    
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISA Finance - Usuário</title>

<link rel="stylesheet" href="css/style.css?v=visual-claro-1">


<link rel="icon" type="image/png" href="assets/icons/isa-finance-v1.png">
<link rel="apple-touch-icon" href="assets/icons/isa-finance-v1.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f5fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ISA Finance">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body>

<header class="topo">

<div class="logo">

<h1><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 8V5a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h14v12H6a3 3 0 0 1-3-3V6m17 6h-5v6h5"/><path d="M17 15h.01"/></svg><span>ISA Finance</span></h1>

<span id="nomeUsuario">
Carregando...
</span>
<small id="tipoUsuario">Carregando...</small>
 
</div>

<div class="acoesTopo">

<select id="mesSelecionado" aria-label="Mês de referência">

    <option value="2026-06">Junho / 2026</option>
    <option value="2026-07" selected>Julho / 2026</option>
    <option value="2026-08">Agosto / 2026</option>
    <option value="2026-09">Setembro / 2026</option>
    <option value="2026-10">Outubro / 2026</option>
    <option value="2026-11">Novembro / 2026</option>
    <option value="2026-12">Dezembro / 2026</option>

    <option value="2027-01">Janeiro / 2027</option>
    <option value="2027-02">Fevereiro / 2027</option>
    <option value="2027-03">Março / 2027</option>
    <option value="2027-04">Abril / 2027</option>
    <option value="2027-05">Maio / 2027</option>
    <option value="2027-06">Junho / 2027</option>
    <option value="2027-07">Julho / 2027</option>
    <option value="2027-08">Agosto / 2027</option>
    <option value="2027-09">Setembro / 2027</option>
    <option value="2027-10">Outubro / 2027</option>
    <option value="2027-11">Novembro / 2027</option>
    <option value="2027-12">Dezembro / 2027</option>

</select>

<button class="btnSair" aria-label="Sair da conta" title="Sair da conta" onclick="sair()"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg><span class="action-label">Sair</span></button>

</div>

</header>

<nav class="tabs-principais" aria-label="Áreas do usuário">
<button class="aba ativa" type="button" data-aba="resumo"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Resumo</span></button>
<button class="aba" type="button" data-aba="saque"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 8V5a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h14v12H6a3 3 0 0 1-3-3V6m17 6h-5v6h5"/><path d="M17 15h.01"/></svg><span>Saque</span></button>
<button class="aba" type="button" data-aba="historico"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2.7 7M3 4v7h7m2-4v5l3 2"/></svg><span>Histórico</span></button>
</nav>

<main class="container">

<section class="area-aba ativa" data-area="resumo"><div class="cards">

<div class="card">
<h3>💰 Total Gerado</h3>
<h2 id="totalGerado">€ 0,00</h2>
</div>

<div class="card">
<h3>🏦 Fundo Separado</h3>
<h2 id="fundoSeparado">€ 0,00</h2>
</div>

<div class="card">
<h3>⏳ Falta Separar</h3>
<h2 id="faltaSeparar">€ 0,00</h2>
</div>

<div class="card">
<h3>💳 Disponível para Saque</h3>
<h2 id="saldoDisponivel">€ 0,00</h2>
</div>

<div class="card">
<h3>💸 Total Sacado</h3>
<h2 id="totalSacado">€ 0,00</h2>
</div>

<div class="card">
<h3>📊 Percentual Atual</h3>
<h2 id="percentualAtual">12%</h2>
</div>

</div>
</section>

<section class="historico area-aba" data-area="historico">

<h2>📜 Histórico de Saques</h2>

<table>

<thead>

<tr>

<th>Data</th>
<th>Valor</th>
<th>Status</th>

</tr>

</thead>

<tbody id="listaSaques">

</tbody>

</table>

</section>

<section class="area-aba saque-usuario" data-area="saque"><div style="margin-top:30px;text-align:center;">
<input
    type="number"
    id="valorSaque"
    placeholder="Digite o valor do saque (€)"
    min="0.01"
    step="0.01"
    style="width:300px;max-width:90%;margin-bottom:15px;">
<button id="btnSolicitarSaque">

💸 Solicitar Saque

</button>

</div>
</section>

</main>

<footer class="rodape-fixo">
<button class="aba ativa" type="button" data-aba="resumo"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Início</span></button>
<button class="aba" type="button" data-aba="saque"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 8V5a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h14v12H6a3 3 0 0 1-3-3V6m17 6h-5v6h5"/><path d="M17 15h.01"/></svg><span>Saque</span></button>
<button class="aba" type="button" data-aba="historico"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2.7 7M3 4v7h7m2-4v5l3 2"/></svg><span>Histórico</span></button>
</footer>

<script type="module" src="js/usuario.js"></script>

</body>

</html>
